name: Build extension packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Package Chrome and Firefox extensions
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate semver tag and versions
        run: node scripts/verify-version.mjs --tag="${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check whitespace errors
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Package Chrome zip
        run: npm run package:chrome -- --name "linuxdo-friends-${GITHUB_REF_NAME}-chrome.zip"

      - name: Package Firefox zip
        run: npm run package:firefox -- --name "linuxdo-friends-${GITHUB_REF_NAME}-firefox.zip"

      - name: Verify release packages
        run: |
          node scripts/verify-release-package.mjs --browser chrome --zip "packages/linuxdo-friends-${GITHUB_REF_NAME}-chrome.zip" --tag "${GITHUB_REF_NAME}"
          node scripts/verify-release-package.mjs --browser firefox --zip "packages/linuxdo-friends-${GITHUB_REF_NAME}-firefox.zip" --tag "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            packages/linuxdo-friends-${{ github.ref_name }}-chrome.zip
            packages/linuxdo-friends-${{ github.ref_name }}-firefox.zip
          fail_on_unmatched_files: true
